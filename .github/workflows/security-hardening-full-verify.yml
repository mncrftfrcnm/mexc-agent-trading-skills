name: Security Hardening Full Verification

on:
  push:
    branches:
      - security/harden-ci-and-live-confirmation

permissions:
  contents: read
  statuses: write

env:
  GITLEAKS_COMMIT: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e
  TRUFFLEHOG_COMMIT: 6f3c981e7b77f235fd2702dd74af25fc4b72bf11
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        id: setup_python
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Go
        id: setup_go
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Build pinned scanners from exact source commits
        id: scanner_install
        if: steps.setup_go.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="$RUNNER_TEMP/security-bin"
          mkdir -p "$BIN_DIR"

          build_scanner() {
            local repo_url="$1"
            local commit="$2"
            local name="$3"
            local src="$RUNNER_TEMP/${name}-src"
            git init -q "$src"
            git -C "$src" remote add origin "$repo_url"
            git -C "$src" -c protocol.version=2 fetch --quiet --depth=1 origin "$commit"
            git -C "$src" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$src" rev-parse HEAD)" = "$commit"
            (cd "$src" && go build -trimpath -o "$BIN_DIR/$name" .)
          }

          build_scanner https://github.com/gitleaks/gitleaks.git "$GITLEAKS_COMMIT" gitleaks
          build_scanner https://github.com/trufflesecurity/trufflehog.git "$TRUFFLEHOG_COMMIT" trufflehog
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/gitleaks" version
          "$BIN_DIR/trufflehog" --version

      - name: Run Python security and compatibility suite
        id: python_tests
        if: steps.setup_python.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python codex_mexc_skills/skills/mexc-spot-rest/scripts/mexc_spot_request.py --self-test
          python codex_mexc_skills/skills/mexc-futures-rest/scripts/mexc_futures_request.py --self-test
          python -m compileall -q codex_mexc_skills claude_mexc_skills tests

      - name: Run Gitleaks
        id: gitleaks_scan
        if: steps.scanner_install.outcome == 'success'
        continue-on-error: true
        run: gitleaks git --verbose --redact .

      - name: Run TruffleHog
        id: trufflehog_scan
        if: steps.scanner_install.outcome == 'success'
        continue-on-error: true
        run: trufflehog git file://. --results=verified --fail --github-actions --no-update

      - name: Run repeated live public MEXC checks
        id: live_mexc
        if: steps.setup_python.outcome == 'success'
        continue-on-error: true
        run: python tests/live_public_smoke.py --iterations 12 --delay 0.3

      - name: Publish diagnostic commit statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_PYTHON: ${{ steps.setup_python.outcome }}
          SETUP_GO: ${{ steps.setup_go.outcome }}
          SCANNER_INSTALL: ${{ steps.scanner_install.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          GITLEAKS_SCAN: ${{ steps.gitleaks_scan.outcome }}
          TRUFFLEHOG_SCAN: ${{ steps.trufflehog_scan.outcome }}
          LIVE_MEXC: ${{ steps.live_mexc.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          post_status() {
            local context="$1"
            local outcome="$2"
            local description="$3"
            local state=failure
            if [ "$outcome" = "success" ]; then state=success; fi
            local payload
            payload=$(python - "$state" "$context" "$description" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3]}))
          PY
            )
            curl --fail-with-body --silent --show-error \
              --proto '=https' --retry 3 -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }
          post_status 'security-hardening/setup-python' "$SETUP_PYTHON" 'Pinned setup-python resolved Python 3.14'
          post_status 'security-hardening/setup-go' "$SETUP_GO" 'Pinned setup-go resolved Go 1.26.5'
          post_status 'security-hardening/scanner-install' "$SCANNER_INSTALL" 'Pinned scanner commits fetched, verified, and built'
          post_status 'security-hardening/python-tests' "$PYTHON_TESTS" 'Security tests, self-tests, compileall'
          post_status 'security-hardening/gitleaks' "$GITLEAKS_SCAN" 'Gitleaks full-history scan'
          post_status 'security-hardening/trufflehog' "$TRUFFLEHOG_SCAN" 'TruffleHog verified-secret scan'
          post_status 'security-hardening/live-public-mexc' "$LIVE_MEXC" '49 credential-free public MEXC API checks'

      - name: Fail workflow if any verification stage failed
        if: >-
          steps.setup_python.outcome != 'success' ||
          steps.setup_go.outcome != 'success' ||
          steps.scanner_install.outcome != 'success' ||
          steps.python_tests.outcome != 'success' ||
          steps.gitleaks_scan.outcome != 'success' ||
          steps.trufflehog_scan.outcome != 'success' ||
          steps.live_mexc.outcome != 'success'
        run: exit 1
