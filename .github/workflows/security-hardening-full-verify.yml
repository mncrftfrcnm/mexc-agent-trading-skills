name: Security Hardening Full Verification

on:
  push:
    branches:
      - security/harden-ci-and-live-confirmation

permissions:
  contents: read
  statuses: write

env:
  GITLEAKS_COMMIT: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e
  TRUFFLEHOG_COMMIT: 6f3c981e7b77f235fd2702dd74af25fc4b72bf11

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Run full hardening verification
        id: verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-bin"
          export GOBIN="$RUNNER_TEMP/security-bin"
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_COMMIT}"
          go install "github.com/trufflesecurity/trufflehog/v3@${TRUFFLEHOG_COMMIT}"
          export PATH="$GOBIN:$PATH"
          gitleaks version
          trufflehog --version
          python -m unittest discover -s tests -p 'test_*.py' -v
          python codex_mexc_skills/skills/mexc-spot-rest/scripts/mexc_spot_request.py --self-test
          python codex_mexc_skills/skills/mexc-futures-rest/scripts/mexc_futures_request.py --self-test
          python -m compileall -q codex_mexc_skills claude_mexc_skills tests
          gitleaks git --verbose --redact .
          trufflehog git file://. --results=verified --fail --github-actions --no-update
          python tests/live_public_smoke.py --iterations 12 --delay 0.3

      - name: Publish full verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verification.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION='Pinned scanners, security suite, scans, and 49 MEXC checks passed'
          else
            STATE=failure
            DESCRIPTION='Full hardening verification failed'
          fi
          PAYLOAD=$(python - "$STATE" "$DESCRIPTION" <<'PY'
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "security-hardening/full-ci-live",
              "description": sys.argv[2],
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --proto '=https' \
            --retry 3 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD"

      - name: Fail workflow if verification failed
        if: steps.verification.outcome != 'success'
        run: exit 1
