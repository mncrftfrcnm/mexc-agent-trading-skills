name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_COMMIT: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e
  TRUFFLEHOG_COMMIT: 6f3c981e7b77f235fd2702dd74af25fc4b72bf11

jobs:
  checks:
    name: Tests, compile, and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install pinned secret scanners from source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-bin"
          export GOBIN="$RUNNER_TEMP/security-bin"
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_COMMIT}"
          go install "github.com/trufflesecurity/trufflehog/v3@${TRUFFLEHOG_COMMIT}"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Verify scanner versions
        run: |
          gitleaks version
          trufflehog --version

      - name: Run adversarial security tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run MEXC Spot REST self-test
        run: python codex_mexc_skills/skills/mexc-spot-rest/scripts/mexc_spot_request.py --self-test

      - name: Run MEXC Futures REST self-test
        run: python codex_mexc_skills/skills/mexc-futures-rest/scripts/mexc_futures_request.py --self-test

      - name: Compile Python files
        run: python -m compileall -q codex_mexc_skills claude_mexc_skills tests

      - name: Run gitleaks secret scan
        run: gitleaks git --verbose --redact .

      - name: Run TruffleHog verified secret scan
        run: trufflehog git file://. --results=verified --fail --github-actions --no-update
