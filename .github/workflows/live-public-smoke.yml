# Manual-only by design: do not make routine CI depend on exchange availability.
name: Public MEXC API Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-smoke:
    name: Credential-free public API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run 49 credential-free live MEXC checks
        run: python tests/live_public_smoke.py --iterations 12 --delay 0.3
