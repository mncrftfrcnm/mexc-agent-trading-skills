name: Security Hardening Verification

on:
  push:
    branches:
      - security/harden-ci-and-live-confirmation

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run security, compatibility, and live public API verification
        id: verification
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python codex_mexc_skills/skills/mexc-spot-rest/scripts/mexc_spot_request.py --self-test
          python codex_mexc_skills/skills/mexc-futures-rest/scripts/mexc_futures_request.py --self-test
          python -m compileall -q codex_mexc_skills claude_mexc_skills tests
          python tests/live_public_smoke.py --iterations 12 --delay 0.3

      - name: Publish verification commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verification.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION='Security suite and 49 public MEXC API checks passed'
          else
            STATE=failure
            DESCRIPTION='Security suite or public MEXC API checks failed'
          fi
          PAYLOAD=$(python - "$STATE" "$DESCRIPTION" <<'PY'
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "security-hardening/live-public-mexc",
              "description": sys.argv[2],
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --proto '=https' \
            --retry 3 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD"

      - name: Fail workflow if verification failed
        if: steps.verification.outcome != 'success'
        run: exit 1
